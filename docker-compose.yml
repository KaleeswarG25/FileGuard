services:
  fileguard:
    build: .
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
    read_only: true
    tmpfs:
      - /tmp:size=128m,noexec,nosuid,nodev
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 768m
    restart: unless-stopped
